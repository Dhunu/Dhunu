<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="128" viewBox="0 0 1200 128" role="img" aria-label="Skills: What I work with.">
<title>Skills: What I work with.</title>
<style>@font-face{font-family:'Geist Mono';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Geist Mono';font-style:normal;font-weight:500;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Instrument Serif';font-style:italic;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Instrument Serif';font-style:normal;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}
  .serif{font-family:'Instrument Serif',Georgia,serif} .sans{font-family:'Geist',system-ui,sans-serif}
  .mono{font-family:'Geist Mono',ui-monospace,Menlo,monospace}
  .rise{animation:rise .9s cubic-bezier(.22,1,.36,1) both} @keyframes rise{from{opacity:0;transform:translateY(22px)}}
  .fade{animation:fade 1s cubic-bezier(.22,1,.36,1) both} @keyframes fade{from{opacity:0}}
  .up{animation:wordup 1.1s cubic-bezier(.22,1,.36,1) both;transform-box:fill-box} @keyframes wordup{from{transform:translateY(105%)}}
  .pulse{animation:pulse 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes pulse{50%{opacity:.35;transform:scale(1.9)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<defs><clipPath id="c"><rect x="0" y="40" width="1200" height="88"/></clipPath></defs>
