<g clip-path="url(#c)"><text x="0" y="104" class="serif up" font-size="62" letter-spacing="-1.4" fill="#efe9df" style="animation-delay:0.10s">What I <tspan font-style="italic" fill="#ff6a3d">work with.</tspan></text></g>
